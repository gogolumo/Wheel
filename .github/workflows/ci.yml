name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log

      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Run domain demo
        run: |
          set -o pipefail
          swift run wheel-demo 2>&1 | tee demo.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-ci-diagnostics-${{ github.run_id }}
          path: |
            build.log
            test.log
            demo.log
          if-no-files-found: ignore
          retention-days: 7
