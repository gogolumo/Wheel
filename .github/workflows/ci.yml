name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check module boundaries
        run: bash scripts/check-module-boundaries.sh

      - name: Swift version
        run: swift --version

      - name: Validate packaging scripts
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/verify-app.sh
          bash -n scripts/install-app.sh
          bash -n scripts/doctor-app.sh
          bash -n scripts/smoke-app.sh
          bash -n scripts/uninstall-app.sh
          bash -n scripts/lib/app-process.sh
          bash -n scripts/test-app-process.sh
          bash scripts/test-app-process.sh

      - name: Build package (including macOS input spike)
        run: |
          set -o pipefail
          swift build -Xswiftc -warnings-as-errors 2>&1 | tee build.log

      - name: Build release configuration
        run: |
          set -o pipefail
          swift build -c release -Xswiftc -warnings-as-errors 2>&1 | tee release-build.log

      - name: Run tests
        run: |
          set -o pipefail
          swift test -Xswiftc -warnings-as-errors 2>&1 | tee test.log

      - name: Run domain demo
        run: |
          set -o pipefail
          swift run -Xswiftc -warnings-as-errors wheel-demo 2>&1 | tee demo.log

      - name: Render README visual fixtures
        run: |
          fixture_dir="$RUNNER_TEMP/wheel-readme-fixtures"
          rm -rf "$fixture_dir"
          swift run wheel-app --render-fixtures "$fixture_dir"
          test -f "$fixture_dir/selected-running-light.png"
          test -f "$fixture_dir/settings-general-content-light.png"
          test -f "$fixture_dir/settings-wheel-layout-content-light.png"
          test -f "$fixture_dir/settings-applications-content-light.png"
          test -f "$fixture_dir/settings-history-content-light.png"
          test -f "$fixture_dir/menu-recent-application-opaque-fallback-light.png"
          find "$fixture_dir" -maxdepth 1 -type f -print | sort

      - name: Upload README visual fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-readme-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/wheel-readme-fixtures
          if-no-files-found: error
          retention-days: 7

      - name: Build and verify installable Wheel.app
        run: |
          running_dist_pid=""
          running_installed_pid=""
          unrelated_wheel_pid=""
          cleanup_test_processes() {
            for pid in "$running_dist_pid" "$running_installed_pid" "$unrelated_wheel_pid"; do
              if [[ -n "$pid" ]] && kill -0 "$pid" >/dev/null 2>&1; then
                kill -TERM "$pid" >/dev/null 2>&1 || true
                wait "$pid" >/dev/null 2>&1 || true
              fi
            done
          }
          trap cleanup_test_processes EXIT

          bash scripts/build-app.sh
          bash scripts/verify-app.sh dist/Wheel.app

          dist_executable="$PWD/dist/Wheel.app/Contents/MacOS/Wheel"
          "$dist_executable" --fixture ready &
          running_dist_pid=$!
          sleep 1
          kill -0 "$running_dist_pid"
          if bash scripts/build-app.sh; then
            echo "Builder replaced a running Wheel.app output" >&2
            exit 1
          fi
          kill -TERM "$running_dist_pid"
          wait "$running_dist_pid" || true
          running_dist_pid=""
          test ! -e dist/.wheel-build.lock

          unrelated_root="$RUNNER_TEMP/unrelated-wheel-process"
          mkdir -p "$unrelated_root"
          cp /bin/sleep "$unrelated_root/Wheel"
          "$unrelated_root/Wheel" 300 &
          unrelated_wheel_pid=$!
          sleep 1
          kill -0 "$unrelated_wheel_pid"
          source scripts/lib/app-process.sh
          test "$(wheel_find_running_pid "$unrelated_root/Wheel")" = "$unrelated_wheel_pid"

          stale_marker="dist/Wheel.app/Contents/Resources/stale-build-marker"
          touch "$stale_marker"
          codesign --force --sign - dist/Wheel.app
          bash scripts/build-app.sh
          test ! -e "$stale_marker"
          test ! -e dist/.wheel-build.lock
          if compgen -G 'dist/.wheel-build.*' >/dev/null; then
            echo "Builder left transaction artifacts behind" >&2
            exit 1
          fi

          foreign_build_root="$RUNNER_TEMP/wheel-build-foreign"
          mkdir -p "$foreign_build_root"
          ditto dist/Wheel.app "$foreign_build_root/Wheel.app"
          plutil -replace CFBundleIdentifier -string com.example.NotWheel "$foreign_build_root/Wheel.app/Contents/Info.plist"
          codesign --force --sign - "$foreign_build_root/Wheel.app"
          if bash scripts/build-app.sh "$foreign_build_root"; then
            echo "Builder replaced an unrelated Wheel.app output" >&2
            exit 1
          fi
          test "$(plutil -extract CFBundleIdentifier raw "$foreign_build_root/Wheel.app/Contents/Info.plist")" = "com.example.NotWheel"

          locked_build_root="$RUNNER_TEMP/wheel-build-locked"
          mkdir -p "$locked_build_root/.wheel-build.lock"
          if bash scripts/build-app.sh "$locked_build_root"; then
            echo "Builder ignored an active build lock" >&2
            exit 1
          fi
          test ! -e "$locked_build_root/Wheel.app"
          rmdir "$locked_build_root/.wheel-build.lock"

          invalid_bundle="$RUNNER_TEMP/invalid-Wheel.app"
          ditto dist/Wheel.app "$invalid_bundle"
          plutil -replace LSUIElement -bool false "$invalid_bundle/Contents/Info.plist"
          codesign --force --sign - "$invalid_bundle"
          if bash scripts/verify-app.sh "$invalid_bundle"; then
            echo "Verifier accepted malformed LSUIElement metadata" >&2
            exit 1
          fi

          install_root="$RUNNER_TEMP/wheel-install"
          mkdir -p "$install_root"
          bash scripts/install-app.sh dist/Wheel.app "$install_root/Wheel.app"

          installed_executable="$install_root/Wheel.app/Contents/MacOS/Wheel"
          "$installed_executable" --fixture ready &
          running_installed_pid=$!
          sleep 1
          kill -0 "$running_installed_pid"
          if bash scripts/install-app.sh dist/Wheel.app "$install_root/Wheel.app"; then
            echo "Installer replaced a running installed Wheel.app" >&2
            exit 1
          fi
          if bash scripts/uninstall-app.sh "$install_root/Wheel.app"; then
            echo "Uninstaller removed a running installed Wheel.app" >&2
            exit 1
          fi
          kill -TERM "$running_installed_pid"
          wait "$running_installed_pid" || true
          running_installed_pid=""

          bash scripts/install-app.sh dist/Wheel.app "$install_root/Wheel.app"
          bash scripts/verify-app.sh "$install_root/Wheel.app"
          doctor_output="$(bash scripts/doctor-app.sh "$install_root/Wheel.app")"
          echo "$doctor_output"
          grep -Fq "Running installed process: NO" <<<"$doctor_output"
          bash scripts/smoke-app.sh "$install_root/Wheel.app"
          kill -0 "$unrelated_wheel_pid"
          test ! -e "$install_root/Wheel.app/Wheel.app"

          foreign_root="$RUNNER_TEMP/wheel-foreign"
          mkdir -p "$foreign_root"
          ditto dist/Wheel.app "$foreign_root/Wheel.app"
          plutil -replace CFBundleIdentifier -string com.example.NotWheel "$foreign_root/Wheel.app/Contents/Info.plist"
          codesign --force --sign - "$foreign_root/Wheel.app"
          if bash scripts/install-app.sh dist/Wheel.app "$foreign_root/Wheel.app"; then
            echo "Installer replaced an unrelated Wheel.app target" >&2
            exit 1
          fi
          test "$(plutil -extract CFBundleIdentifier raw "$foreign_root/Wheel.app/Contents/Info.plist")" = "com.example.NotWheel"
          if bash scripts/uninstall-app.sh "$foreign_root/Wheel.app"; then
            echo "Uninstaller removed an unrelated Wheel.app target" >&2
            exit 1
          fi
          test -d "$foreign_root/Wheel.app"

          malformed_uninstall_root="$RUNNER_TEMP/wheel-malformed-uninstall"
          mkdir -p "$malformed_uninstall_root"
          ditto dist/Wheel.app "$malformed_uninstall_root/Wheel.app"
          rm "$malformed_uninstall_root/Wheel.app/Contents/Resources/Wheel.icns"
          codesign --force --sign - "$malformed_uninstall_root/Wheel.app"
          if bash scripts/uninstall-app.sh "$malformed_uninstall_root/Wheel.app"; then
            echo "Uninstaller removed a malformed same-identifier bundle" >&2
            exit 1
          fi
          test -d "$malformed_uninstall_root/Wheel.app"

          locked_root="$RUNNER_TEMP/wheel-locked"
          mkdir -p "$locked_root/.wheel-install.lock"
          if bash scripts/install-app.sh dist/Wheel.app "$locked_root/Wheel.app"; then
            echo "Installer ignored an active installation lock" >&2
            exit 1
          fi
          test ! -e "$locked_root/Wheel.app"
          rmdir "$locked_root/.wheel-install.lock"

          uninstall_root="$RUNNER_TEMP/wheel-uninstall"
          mkdir -p "$uninstall_root"
          bash scripts/install-app.sh dist/Wheel.app "$uninstall_root/Wheel.app"
          mkdir "$uninstall_root/.wheel-install.lock"
          if bash scripts/uninstall-app.sh "$uninstall_root/Wheel.app"; then
            echo "Uninstaller ignored an active installation lock" >&2
            exit 1
          fi
          test -d "$uninstall_root/Wheel.app"
          rmdir "$uninstall_root/.wheel-install.lock"
          bash scripts/uninstall-app.sh "$uninstall_root/Wheel.app"
          test ! -e "$uninstall_root/Wheel.app"
          test ! -e "$uninstall_root/.wheel-install.lock"
          kill -0 "$unrelated_wheel_pid"
          kill -TERM "$unrelated_wheel_pid"
          wait "$unrelated_wheel_pid" || true
          unrelated_wheel_pid=""

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-ci-diagnostics-${{ github.run_id }}
          path: |
            build.log
            release-build.log
            test.log
            demo.log
          if-no-files-found: ignore
          retention-days: 7
