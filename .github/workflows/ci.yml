name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build package (including macOS input spike)
        run: swift build

      - name: Run tests
        run: swift test

      - name: Run domain demo
        run: swift run wheel-demo

      - name: Build and verify installable Wheel.app
        run: |
          bash scripts/build-app.sh
          test -x dist/Wheel.app/Contents/MacOS/Wheel
          test -f dist/Wheel.app/Contents/Resources/Wheel.icns
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Wheel.app/Contents/Info.plist)" = 'dev.gogolumo.Wheel'
