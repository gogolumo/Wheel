name: Feature work

description: Track one reviewable Wheel implementation card.
title: "[CARD-ID] "
labels: []
body:
  - type: input
    id: card_id
    attributes:
      label: Card ID
      description: Trello card identifier, for example APP-001 or HIST-002.
      placeholder: CARD-ID
    validations:
      required: true
  - type: input
    id: trello
    attributes:
      label: Trello card
      description: Canonical Trello URL for this work item.
      placeholder: https://trello.com/c/...
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the user or system outcome, not the implementation detail.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: List what is included and explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Copy or refine the verifiable Given/When/Then criteria from Trello.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Link blocking work and note the fallback or rollback path.
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
      description: Tests, logs, screenshots, recordings, or other proof needed before merge.
    validations:
      required: true
